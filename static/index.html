<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><link rel="icon" href="/wabix-logo.png" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>WABIX AgentSim · Watch your team work</title
  ><link rel="stylesheet" href="/style.css" />
  <body>
    <header>
      <strong class="brand"
        ><img src="/wabix-logo.png" alt="WABIX" /> <span>AgentSim</span></strong
      >
      <div>
        <button id="connection" aria-label="Account connection settings">
          ○ Connection required</button
        ><button id="help">ⓘ Help</button><b class="tag">Real AI workspace</b>
      </div>
    </header>
    <aside>
      <section class="welcome">
        <div
          class="robot"
          role="img"
          aria-label="Friendly AgentSim robot"
        ></div>
        <h3>Welcome to AgentSim</h3>
        <p>① Check your connection</p>
        <button id="connect">Connection setup</button>
        <p>② Build your team</p>
        <p>③ Watch it work</p>
        <small
          >Your data stays on this computer.<br />Connect an account to run
          AI.</small
        >
      </section>
      <nav id="nav" aria-label="Main menu"></nav>
    </aside>
    <main id="main"></main>
    <div id="toast" role="status"></div>
    <dialog id="dialog">
      <form method="dialog">
        <button class="close" aria-label="Close">×</button>
      </form>
      <div id="dialogBody"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
