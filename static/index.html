<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><link rel="icon" href="/wabix-logo.png" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>WABIX AgentSim · Watch your team work</title
  ><link rel="stylesheet" href="/style.css" />
  <body>
    <header>
      <strong class="brand"
        ><img src="/wabix-logo.png" alt="WABIX" /> <span>AgentSim</span></strong
      >
      <div>
        <button id="connection" aria-label="Account connection settings">
          ○ Connection required</button
        ><button id="help">ⓘ Help</button><b class="tag">Real AI workspace</b>
      </div>
    </header>
    <aside>
      <section class="welcome">
        <div
          class="robot"
          role="img"
          aria-label="Friendly AgentSim robot"
        ></div>
        <h3>Welcome to AgentSim</h3>
      </section>
      <nav id="nav" aria-label="Main menu"></nav>
    </aside>
    <main id="main"></main>
    <footer class="app-footer" aria-label="Application credits">
      <span>Created in 2026 by Felippe da Silva Ferrão - <a href="mailto:felippeferrao@wabix.net">felippeferrao@wabix.net</a></span>
      <strong>Powered By Wabix</strong>
    </footer>
    <div id="toast" role="status"></div>
    <dialog id="dialog">
      <form method="dialog">
        <button class="close" aria-label="Close">×</button>
      </form>
      <div id="dialogBody"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
